      ["What if I end the contract early?","An early termination penalty applies, usually based on the remaining months. Rules differ by provider. I explain the penalty for your chosen plan before you register."],
      ["What speed do I need?","For 1–3 users streaming video, 100–300 Mbps is enough. For 4–6 users, working from home and gaming, go for 500 Mbps. Big homes or many devices, consider 1 Gbps and mesh Wi-Fi."],
      ["Do you do business plans?","Yes. Unifi, Maxis and TIME all have business packages with optional fixed IP and priority support. Contact me with your company details."]
    ]
  }
};

/* =========================================================
   App
   ========================================================= */
let lang = "ms";
try { const s = localStorage.getItem("lang"); if (s === "ms" || s === "en") lang = s; } catch(e){}
let provider = "unifi";

const $ = s => document.querySelector(s);
const waLink = text => `https://wa.me/${CONFIG.phoneIntl}?text=${encodeURIComponent(text)}`;

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("#brandA").innerHTML = `${CONFIG.brand} <span>${CONFIG.brandTag}</span>`;
  $("#langBtn").textContent = lang === "ms" ? "EN" : "BM";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t] ?? ""; });
  document.querySelectorAll("a.wa").forEach(a => a.href = waLink(t.wamsg));

  // tabs
  $("#tabs").innerHTML = Object.entries(PLANS).map(([k,p]) =>
    `<button class="tab" role="tab" data-k="${k}" aria-selected="${k===provider}"><span class="dot" style="background:${p.color}"></span> ${p.name}</button>`).join(" ");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { provider = b.dataset.k; render(); });

  // cards
  const P = PLANS[provider];
  $("#cards").innerHTML = P.items.map(i => `
    <div class="card">
      <div class="spd">${P.name} · ${i.spd}</div>
      <div class="big">RM${i.price}<small>${t.perMonth}</small></div>
      ${i.tag ? `<span class="tag">${i.tag[lang]}</span>` : ""}
      <ul>${i.pts[lang].map(x=>`<li>${x}</li>`).join("")}${i.contract ? `<li>${i.contract} ${t.months}</li>` : ""}</ul>
      <a class="btn" href="${waLink(t.waplan(P.name,i.spd))}">${t.ask}</a>
    </div>`).join("");
  $("#pkgNote").textContent = P.note[lang];

  // comparison table
  const speeds = ["100 Mbps","200 Mbps","300 Mbps","500 Mbps","600 Mbps","1 Gbps","2 Gbps"];
  const cell = (k,s) => { const i = PLANS[k].items.find(x=>x.spd===s); return i ? `RM${i.price}` : "–"; };
  const used = speeds.filter(s => Object.keys(PLANS).some(k => PLANS[k].items.some(x=>x.spd===s)));
  $("#cmp").innerHTML = `<thead><tr><th>${t.cmp_speed}</th>${Object.values(PLANS).map(p=>`<th>${p.name}</th>`).join("")}</tr></thead><tbody>` +
    used.map(s=>`<tr><td><b>${s}</b></td>${Object.keys(PLANS).map(k=>`<td>${cell(k,s)}</td>`).join("")}</tr>`).join("") + `</tbody>`;

  // steps
  $("#steps").innerHTML = [1,2,3,4].map(n => `<div class="step"><h3>${t["s"+n+"h"]}</h3><p>${t["s"+n+"p"]}</p></div>`).join("");

  // faq
  $("#faqList").innerHTML = t.faq.map(([q,a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");

  // contact + footer
  $("#contactLine").innerHTML = `📱 ${CONFIG.phoneShow}` + (CONFIG.area ? ` · ${t.area}${CONFIG.area}` : "");
  $("#disc").textContent = t.disc.replace("{d}", CONFIG.pricesUpdated);
  $("#copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.brand}`;
}

$("#langBtn").onclick = () => {
  lang = lang === "ms" ? "en" : "ms";
  try { localStorage.setItem("lang", lang); } catch(e){}
  render();
};
render();
</script>
</body>
</html>
